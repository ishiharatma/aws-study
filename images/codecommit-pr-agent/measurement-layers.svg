<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#545b64"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="bold" fill="#232f3e">効果を測る 3 つの層と、見せ方</text>

  <rect x="24" y="56" width="120" height="110" rx="8" fill="#fff8ec" stroke="#ec7211"/>
  <text x="84" y="90" text-anchor="middle" font-weight="bold" fill="#232f3e">① レビュー</text>
  <text x="84" y="112" text-anchor="middle" font-weight="bold" fill="#232f3e">の中身</text>
  <text x="84" y="140" text-anchor="middle" font-size="11" fill="#545b64">何を指摘したか</text>
  <rect x="170" y="56" width="250" height="110" rx="8" fill="#ffffff" stroke="#ec7211"/>
  <text x="182" y="80" font-size="13" fill="#232f3e">tool_use の構造化出力</text>
  <text x="182" y="102" font-size="12" fill="#232f3e">指摘数（重要度別）/ LGTM</text>
  <text x="182" y="122" font-size="12" fill="#232f3e">複数モデルの一致・独自検出</text>
  <text x="182" y="142" font-size="12" fill="#232f3e">所要時間 / SLA 超過 / エラー</text>
  <line x1="420" y1="111" x2="470" y2="111" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="56" width="200" height="110" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="570" y="90" text-anchor="middle" font-weight="bold" fill="#232f3e">CloudWatch</text>
  <text x="570" y="112" text-anchor="middle" font-weight="bold" fill="#232f3e">カスタムメトリクス</text>
  <text x="570" y="140" text-anchor="middle" font-size="11" fill="#545b64">Lambda が PutMetricData</text>

  <rect x="24" y="186" width="120" height="110" rx="8" fill="#fff8ec" stroke="#ec7211"/>
  <text x="84" y="220" text-anchor="middle" font-weight="bold" fill="#232f3e">② コストと</text>
  <text x="84" y="242" text-anchor="middle" font-weight="bold" fill="#232f3e">利用状況</text>
  <text x="84" y="270" text-anchor="middle" font-size="11" fill="#545b64">誰が何を使ったか</text>
  <rect x="170" y="186" width="250" height="110" rx="8" fill="#ffffff" stroke="#ec7211"/>
  <text x="182" y="210" font-size="13" fill="#232f3e">Bedrock の呼び出しログ</text>
  <text x="182" y="232" font-size="12" fill="#232f3e">requestMetadata に</text>
  <text x="182" y="252" font-size="12" fill="#232f3e">リポジトリ / PR 作成者 / 環境を付与</text>
  <text x="182" y="272" font-size="12" fill="#232f3e">→ トークン数を軸ごとに集計</text>
  <line x1="420" y1="241" x2="470" y2="241" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="186" width="200" height="110" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="570" y="220" text-anchor="middle" font-weight="bold" fill="#232f3e">CloudWatch Logs</text>
  <text x="570" y="242" text-anchor="middle" font-weight="bold" fill="#232f3e">（Logs Insights）</text>
  <text x="570" y="270" text-anchor="middle" font-size="11" fill="#545b64">単価は設定値で掛け算</text>

  <rect x="24" y="316" width="120" height="110" rx="8" fill="#fff8ec" stroke="#ec7211"/>
  <text x="84" y="350" text-anchor="middle" font-weight="bold" fill="#232f3e">③ 開発の</text>
  <text x="84" y="372" text-anchor="middle" font-weight="bold" fill="#232f3e">流れ</text>
  <text x="84" y="400" text-anchor="middle" font-size="11" fill="#545b64">マージまでの時間</text>
  <rect x="170" y="316" width="250" height="110" rx="8" fill="#ffffff" stroke="#ec7211"/>
  <text x="182" y="340" font-size="13" fill="#232f3e">PR ステータス変更のイベント</text>
  <text x="182" y="362" font-size="12" fill="#232f3e">GetPullRequest で</text>
  <text x="182" y="382" font-size="12" fill="#232f3e">マージ済みか判定（却下は除外）</text>
  <text x="182" y="402" font-size="12" fill="#232f3e">→ 作成〜マージの時間を JSON に</text>
  <line x1="420" y1="371" x2="470" y2="371" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="316" width="200" height="110" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="570" y="350" text-anchor="middle" font-weight="bold" fill="#232f3e">S3</text>
  <text x="570" y="372" text-anchor="middle" font-weight="bold" fill="#232f3e">reports/pr_lead_time/</text>
  <text x="570" y="400" text-anchor="middle" font-size="11" fill="#545b64">日付パーティション</text>

  <line x1="670" y1="130" x2="720" y2="200" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="241" x2="720" y2="241" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="720" y="186" width="216" height="110" rx="8" fill="#eaf5e6" stroke="#1d8102"/>
  <text x="828" y="216" text-anchor="middle" font-weight="bold" fill="#232f3e">レポート生成 Lambda</text>
  <text x="828" y="238" text-anchor="middle" font-size="12" fill="#232f3e">日次 / 週次 / 月次</text>
  <text x="828" y="258" text-anchor="middle" font-size="12" fill="#232f3e">Logs Insights で集計</text>
  <text x="828" y="278" text-anchor="middle" font-size="11" fill="#545b64">スケジュール起動</text>

  <line x1="828" y1="296" x2="828" y2="330" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="720" y="330" width="216" height="96" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="828" y="356" text-anchor="middle" font-weight="bold" fill="#232f3e">S3 に JSON 保存</text>
  <text x="828" y="378" text-anchor="middle" font-size="12" fill="#232f3e">SNS でメール / Slack / Teams</text>
  <text x="828" y="398" text-anchor="middle" font-size="12" fill="#232f3e">利用状況ダッシュボードが参照</text>

  <text x="24" y="466" font-size="12" fill="#545b64">CloudWatch ダッシュボードは①のメトリクスをそのまま表示する。③の JSON は現状「記録」までで、集計・可視化は未対応。</text>
</svg>
