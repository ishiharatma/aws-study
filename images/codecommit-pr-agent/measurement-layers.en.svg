<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#545b64"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="bold" fill="#232f3e">Three layers for measuring the effect, and how to show them</text>

  <rect x="24" y="56" width="120" height="110" rx="8" fill="#fff8ec" stroke="#ec7211"/>
  <text x="84" y="90" text-anchor="middle" font-weight="bold" fill="#232f3e">① Review</text>
  <text x="84" y="112" text-anchor="middle" font-weight="bold" fill="#232f3e">content</text>
  <text x="84" y="140" text-anchor="middle" font-size="11" fill="#545b64">What was flagged</text>
  <rect x="170" y="56" width="250" height="110" rx="8" fill="#ffffff" stroke="#ec7211"/>
  <text x="182" y="80" font-size="13" fill="#232f3e">tool_use structured output</text>
  <text x="182" y="102" font-size="12" fill="#232f3e">Findings (by severity) / LGTM</text>
  <text x="182" y="122" font-size="12" fill="#232f3e">Agreement / unique findings across models</text>
  <text x="182" y="142" font-size="12" fill="#232f3e">Duration / SLA breaches / errors</text>
  <line x1="420" y1="111" x2="470" y2="111" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="56" width="200" height="110" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="570" y="90" text-anchor="middle" font-weight="bold" fill="#232f3e">CloudWatch</text>
  <text x="570" y="112" text-anchor="middle" font-weight="bold" fill="#232f3e">custom metrics</text>
  <text x="570" y="140" text-anchor="middle" font-size="11" fill="#545b64">Lambda calls PutMetricData</text>

  <rect x="24" y="186" width="120" height="110" rx="8" fill="#fff8ec" stroke="#ec7211"/>
  <text x="84" y="220" text-anchor="middle" font-weight="bold" fill="#232f3e">② Cost and</text>
  <text x="84" y="242" text-anchor="middle" font-weight="bold" fill="#232f3e">usage</text>
  <text x="84" y="270" text-anchor="middle" font-size="11" fill="#545b64">Who used what</text>
  <rect x="170" y="186" width="250" height="110" rx="8" fill="#ffffff" stroke="#ec7211"/>
  <text x="182" y="210" font-size="13" fill="#232f3e">Bedrock invocation log</text>
  <text x="182" y="232" font-size="12" fill="#232f3e">Add to requestMetadata:</text>
  <text x="182" y="252" font-size="12" fill="#232f3e">repository / PR author / environment</text>
  <text x="182" y="272" font-size="12" fill="#232f3e">→ aggregate tokens per axis</text>
  <line x1="420" y1="241" x2="470" y2="241" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="186" width="200" height="110" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="570" y="220" text-anchor="middle" font-weight="bold" fill="#232f3e">CloudWatch Logs</text>
  <text x="570" y="242" text-anchor="middle" font-weight="bold" fill="#232f3e">(Logs Insights)</text>
  <text x="570" y="270" text-anchor="middle" font-size="11" fill="#545b64">Multiply by configured unit prices</text>

  <rect x="24" y="316" width="120" height="110" rx="8" fill="#fff8ec" stroke="#ec7211"/>
  <text x="84" y="350" text-anchor="middle" font-weight="bold" fill="#232f3e">③ Development</text>
  <text x="84" y="372" text-anchor="middle" font-weight="bold" fill="#232f3e">flow</text>
  <text x="84" y="400" text-anchor="middle" font-size="11" fill="#545b64">Time to merge</text>
  <rect x="170" y="316" width="250" height="110" rx="8" fill="#ffffff" stroke="#ec7211"/>
  <text x="182" y="340" font-size="13" fill="#232f3e">PR status change event</text>
  <text x="182" y="362" font-size="12" fill="#232f3e">Check with GetPullRequest</text>
  <text x="182" y="382" font-size="12" fill="#232f3e">whether merged (skip rejected)</text>
  <text x="182" y="402" font-size="12" fill="#232f3e">→ creation-to-merge time as JSON</text>
  <line x1="420" y1="371" x2="470" y2="371" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="316" width="200" height="110" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="570" y="350" text-anchor="middle" font-weight="bold" fill="#232f3e">S3</text>
  <text x="570" y="372" text-anchor="middle" font-weight="bold" fill="#232f3e">reports/pr_lead_time/</text>
  <text x="570" y="400" text-anchor="middle" font-size="11" fill="#545b64">Date partitions</text>

  <line x1="670" y1="130" x2="720" y2="200" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="241" x2="720" y2="241" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="720" y="186" width="216" height="110" rx="8" fill="#eaf5e6" stroke="#1d8102"/>
  <text x="828" y="216" text-anchor="middle" font-weight="bold" fill="#232f3e">Report generator Lambda</text>
  <text x="828" y="238" text-anchor="middle" font-size="12" fill="#232f3e">Daily / weekly / monthly</text>
  <text x="828" y="258" text-anchor="middle" font-size="12" fill="#232f3e">Aggregates with Logs Insights</text>
  <text x="828" y="278" text-anchor="middle" font-size="11" fill="#545b64">Scheduled invocation</text>

  <line x1="828" y1="296" x2="828" y2="330" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="720" y="330" width="216" height="96" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="828" y="356" text-anchor="middle" font-weight="bold" fill="#232f3e">JSON saved to S3</text>
  <text x="828" y="378" text-anchor="middle" font-size="12" fill="#232f3e">Email / Slack / Teams via SNS</text>
  <text x="828" y="398" text-anchor="middle" font-size="12" fill="#232f3e">Read by the usage dashboard</text>

  <text x="24" y="466" font-size="12" fill="#545b64">The CloudWatch dashboard shows the metrics of ① as they are. The JSON of ③ is viewed on the usage dashboard (before/after comparison is not available yet).</text>
</svg>
