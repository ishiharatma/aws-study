<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#545b64"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="bold" fill="#232f3e">PR レビューの流れ（PR の作成・更新 1 回分）</text>

  <rect x="24" y="130" width="150" height="80" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="99" y="162" text-anchor="middle" font-weight="bold" fill="#232f3e">CodeCommit</text>
  <text x="99" y="184" text-anchor="middle" font-size="12" fill="#232f3e">PR 作成 / 更新</text>
  <line x1="174" y1="170" x2="214" y2="170" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="214" y="130" width="130" height="80" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="279" y="162" text-anchor="middle" font-weight="bold" fill="#232f3e">EventBridge</text>
  <text x="279" y="184" text-anchor="middle" font-size="12" fill="#232f3e">PR イベント</text>
  <line x1="344" y1="170" x2="384" y2="170" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="384" y="70" width="270" height="200" rx="8" fill="#fff8ec" stroke="#ec7211"/>
  <text x="519" y="96" text-anchor="middle" font-weight="bold" fill="#232f3e">Lambda（Python）</text>
  <text x="519" y="122" text-anchor="middle" font-size="13" fill="#232f3e">① 差分を作る（blob から diff 生成）</text>
  <text x="519" y="146" text-anchor="middle" font-size="13" fill="#232f3e">② パスで code / document / skip に分類</text>
  <text x="519" y="170" text-anchor="middle" font-size="13" fill="#232f3e">③ 複数モデルでレビュー → 統合</text>
  <text x="519" y="194" text-anchor="middle" font-size="13" fill="#232f3e">④ 構造化データ（指摘・LGTM）を取得</text>
  <text x="519" y="218" text-anchor="middle" font-size="13" fill="#232f3e">⑤ コメント投稿 + メトリクス送出</text>
  <text x="519" y="248" text-anchor="middle" font-size="12" fill="#545b64">失敗は DLQ（SQS）へ</text>

  <line x1="654" y1="130" x2="714" y2="100" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="714" y="64" width="222" height="60" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="825" y="90" text-anchor="middle" font-weight="bold" fill="#232f3e">Amazon Bedrock</text>
  <text x="825" y="110" text-anchor="middle" font-size="12" fill="#232f3e">レビュー用モデル ×複数 / 統合用モデル</text>

  <line x1="654" y1="170" x2="714" y2="170" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="714" y="144" width="222" height="52" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="825" y="166" text-anchor="middle" font-weight="bold" fill="#232f3e">Knowledge Base</text>
  <text x="825" y="184" text-anchor="middle" font-size="12" fill="#232f3e">仕様書・ADR を参照（RAG）</text>

  <line x1="654" y1="210" x2="714" y2="240" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="714" y="216" width="222" height="56" rx="8" fill="#eaf5e6" stroke="#1d8102"/>
  <text x="825" y="240" text-anchor="middle" font-weight="bold" fill="#232f3e">PR コメント</text>
  <text x="825" y="258" text-anchor="middle" font-size="12" fill="#232f3e">CodeCommit に投稿</text>

  <line x1="519" y1="270" x2="519" y2="310" stroke="#545b64" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="24" y="310" width="912" height="72" rx="8" fill="#f2f3f3" stroke="#545b64" stroke-dasharray="5 4"/>
  <text x="40" y="336" font-weight="bold" fill="#232f3e">レビューと並行して残すもの（次の図で説明）</text>
  <text x="40" y="362" fill="#232f3e">CloudWatch カスタムメトリクス　/　Bedrock の呼び出しログ（誰の PR か・どのリポジトリか付き）　/　PR マージ時のリードタイム記録</text>
</svg>
