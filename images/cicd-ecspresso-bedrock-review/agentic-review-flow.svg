<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#545b64"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>

  <!-- title -->
  <text x="24" y="32" font-size="16" font-weight="bold" fill="#232f3e">AgenticReview ステージの中身（CodeBuild 1回の実行）</text>

  <!-- 1. clone + diff -->
  <rect x="24" y="150" width="170" height="90" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="109" y="182" text-anchor="middle" font-weight="bold" fill="#232f3e">① 差分を作る</text>
  <text x="109" y="206" text-anchor="middle" fill="#232f3e">履歴付きで clone</text>
  <text x="109" y="226" text-anchor="middle" fill="#232f3e">HEAD~1 と HEAD の diff</text>

  <line x1="194" y1="195" x2="252" y2="195" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. four perspectives -->
  <rect x="252" y="64" width="270" height="262" rx="8" fill="#fff8ec" stroke="#ec7211"/>
  <text x="387" y="92" text-anchor="middle" font-weight="bold" fill="#232f3e">② Bedrock を 4 観点で並列に呼ぶ</text>
  <text x="387" y="112" text-anchor="middle" font-size="12" fill="#545b64">同じ diff を観点ごとのプロンプトで送る</text>

  <rect x="272" y="128" width="230" height="40" rx="6" fill="#ffffff" stroke="#ec7211"/>
  <text x="387" y="153" text-anchor="middle" fill="#232f3e">セキュリティ</text>
  <rect x="272" y="176" width="230" height="40" rx="6" fill="#ffffff" stroke="#ec7211"/>
  <text x="387" y="201" text-anchor="middle" fill="#232f3e">インフラ / 運用</text>
  <rect x="272" y="224" width="230" height="40" rx="6" fill="#ffffff" stroke="#ec7211"/>
  <text x="387" y="249" text-anchor="middle" fill="#232f3e">コード品質</text>
  <rect x="272" y="272" width="230" height="40" rx="6" fill="#ffffff" stroke="#ec7211"/>
  <text x="387" y="297" text-anchor="middle" fill="#232f3e">コスト</text>

  <line x1="522" y1="195" x2="580" y2="195" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="551" y="184" text-anchor="middle" font-size="11" fill="#545b64">riskLevel</text>
  <text x="551" y="222" text-anchor="middle" font-size="11" fill="#545b64">findings</text>

  <!-- 3. aggregate -->
  <rect x="580" y="150" width="170" height="90" rx="8" fill="#f2f3f3" stroke="#545b64"/>
  <text x="665" y="182" text-anchor="middle" font-weight="bold" fill="#232f3e">③ 集約</text>
  <text x="665" y="206" text-anchor="middle" fill="#232f3e">最も高い riskLevel を</text>
  <text x="665" y="226" text-anchor="middle" fill="#232f3e">全体の判定にする</text>

  <line x1="750" y1="195" x2="790" y2="195" stroke="#545b64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. decision -->
  <polygon points="790,195 850,150 910,195 850,240" fill="#ffffff" stroke="#232f3e" stroke-width="1.5"/>
  <text x="850" y="192" text-anchor="middle" font-size="12" fill="#232f3e">しきい値</text>
  <text x="850" y="208" text-anchor="middle" font-size="12" fill="#232f3e">以上？</text>

  <!-- block -->
  <line x1="850" y1="150" x2="850" y2="108" stroke="#d13212" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="770" y="64" width="160" height="44" rx="6" fill="#fdecea" stroke="#d13212"/>
  <text x="850" y="83" text-anchor="middle" font-weight="bold" fill="#d13212">exit 1</text>
  <text x="850" y="100" text-anchor="middle" font-size="12" fill="#232f3e">パイプラインが止まる</text>

  <!-- pass -->
  <line x1="850" y1="240" x2="850" y2="282" stroke="#1d8102" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="770" y="282" width="160" height="44" rx="6" fill="#eaf5e6" stroke="#1d8102"/>
  <text x="850" y="301" text-anchor="middle" font-weight="bold" fill="#1d8102">exit 0</text>
  <text x="850" y="318" text-anchor="middle" font-size="12" fill="#232f3e">Approve → Deploy へ</text>

  <!-- side outputs -->
  <line x1="665" y1="240" x2="665" y2="346" stroke="#545b64" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="24" y="346" width="912" height="72" rx="8" fill="#f2f3f3" stroke="#545b64" stroke-dasharray="5 4"/>
  <text x="40" y="370" font-weight="bold" fill="#232f3e">判定と並行して出力するもの（失敗してもビルドは失敗させない）</text>
  <text x="40" y="394" fill="#232f3e">SNS 通知（承認者が Approve の前に読む）　/　CloudWatch メトリクス（リスク分布・ブロック数・トークン・レイテンシ）　/　レポート JSON（アーティファクト）</text>
</svg>
